# Copy to .github/workflows/literature-site.yml in the student's repository.
name: Publish literature site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: literature-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - run: python -m pip install -r Lit-Site/requirements-site.txt
      - run: python -m mkdocs build --strict -f Lit-Site/mkdocs.yml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: Lit-Site/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
